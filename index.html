  const icon = (name,cls='') => `<svg class="${h(cls)}" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||ICONS.info}</svg>`;
  const iconify = (root=document) => root.querySelectorAll('[data-icon]').forEach(el => {el.innerHTML=icon(el.dataset.icon)});

  function nextDayOfMonth(day){const t=parseDate(today()),y=t.getFullYear(),m=t.getMonth();let test=new Date(y,m,Math.min(day,new Date(y,m+1,0).getDate()),12);if(test < t) test=new Date(y,m+1,Math.min(day,new Date(y,m+2,0).getDate()),12);return dateISO(test)}
  function demo() {
    const b=(name,cost,day,category,frequency='monthly')=>({id:uid(),name,amount:cost,nextDue:nextDayOfMonth(day),anchorDay:day,category,frequency,autopay:false,payments:[]});
    const d=(name,balance,original,apr,minPayment,promoEnd='')=>({id:uid(),name,balance,originalBalance:original,apr,minPayment,promoEnd,payments:[]});
    return {version:1,mode:'demo',incomes:[{id:uid(),name:'Main salary',amount:2850,frequency:'monthly'},{id:uid(),name:'Second income',amount:420,frequency:'fourweekly'}],bills:[b('Rent',895,1,'Home'),b('Energy',135,7,'Utilities'),b('Council tax',165,12,'Home'),b('Broadband',34,17,'Utilities'),b('Mobile phone',29,20,'Subscriptions'),b('Car insurance',58,25,'Insurance'),b('Streaming service',12.99,4,'Subscriptions')],debts:[d('Credit card',1900,3200,24.9,90),d('Car loan',5600,9200,7.9,155),d('0% credit card',1250,2300,21.9,50,'2027-06-01')],settings:{extraPayment:100,strategy:'avalanche'}};
  }
  const validDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!Number.isNaN(parseDate(s).getTime())&&dateISO(parseDate(s))===s;
  function sanitizeState(x) {
    if(!x||typeof x!=='object'||!Array.isArray(x.bills)||!Array.isArray(x.debts)||!Array.isArray(x.incomes))throw Error('This is not a valid Billora backup.');
    const cleanFreq=v=>Object.prototype.hasOwnProperty.call(frequencyLabels,v)?v:'monthly';
    const safeMoney=v=>Math.min(1e10,Math.max(0,round(v)));
    const safeName=v=>String(v||'Untitled').slice(0,100);
    const incomes=x.incomes.slice(0,500).map(z=>({id:uid(),name:safeName(z.name),amount:safeMoney(z.amount),frequency:cleanFreq(z.frequency)}));
    const bills=x.bills.slice(0,1000).map(z=>({id:uid(),name:safeName(z.name),amount:safeMoney(z.amount),frequency:cleanFreq(z.frequency),category:Object.keys(categoryColors).includes(z.category)?z.category:'Other',nextDue:validDate(z.nextDue)?z.nextDue:today(),anchorDay:Math.max(1,Math.min(31,Number(z.anchorDay)||parseDate(z.nextDue||today()).getDate())),autopay:false,payments:Array.isArray(z.payments)?z.payments.slice(-30).filter(p=>validDate(p.date)&&Number(p.amount)>0).map(p=>({date:p.date,amount:safeMoney(p.amount),due:validDate(p.due)?p.due:undefined})):[]}));
    const debts=x.debts.slice(0,500).map(z=>({id:uid(),name:safeName(z.name),balance:safeMoney(z.balance),originalBalance:Math.max(safeMoney(z.balance),safeMoney(z.originalBalance)),apr:Math.min(100,Math.max(0,Number(z.apr)||0)),minPayment:safeMoney(z.minPayment),promoEnd:validDate(z.promoEnd)?z.promoEnd:'',payments:Array.isArray(z.payments)?z.payments.slice(-30).filter(p=>validDate(p.date)&&Number(p.amount)>0).map(p=>({date:p.date,amount:safeMoney(p.amount)})):[]}));
    return {version:1,mode:'personal',incomes,bills,debts,settings:{strategy:x.settings?.strategy==='snowball'?'snowball':'avalanche',extraPayment:Math.min(3000,Math.max(0,Math.round(Number(x.settings?.extraPayment)||0)))}};
  }
  function load() {try{const json=localStorage.getItem(STORAGE_KEY);return json?parseStored(JSON.parse(json)):demo()}catch(e){return demo()}}
  function parseStored(obj){if(!obj||!Array.isArray(obj.bills)||!Array.isArray(obj.debts)||!Array.isArray(obj.incomes)||!obj.settings)throw Error('Invalid local data');return obj}
  let state=load();
  let page=['overview','bills','debts','planner','settings'].includes(location.hash.slice(1))?location.hash.slice(1):'overview';
  let query='';let toastTimer=null;
  function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){notify('Storage is unavailable. Export your data to keep a backup.')} }
  const sum=arr=>arr.reduce((a,b)=>a+Number(b||0),0);
  const incomeMonthly=()=>sum(state.incomes.map(i=>recurringMonthly(i.amount,i.frequency)));
  const billsMonthly=()=>sum(state.bills.map(i=>recurringMonthly(i.amount,i.frequency)));
  const minimumsMonthly=()=>sum(state.debts.filter(d=>d.balance>0).map(d=>d.minPayment));
  const totalDebt=()=>sum(state.debts.map(d=>d.balance));
  const originals=()=>sum(state.debts.map(d=>d.originalBalance));
  const moneyLeft=()=>incomeMonthly()-billsMonthly()-minimumsMonthly();
  const getBill=id=>state.bills.find(x=>x.id===id),getDebt=id=>state.debts.find(x=>x.id===id),getIncome=id=>state.incomes.find(x=>x.id===id);
  const status = bill => {const n=daysUntil(bill.nextDue);return n<0?{label:'Overdue',type:'overdue'}:n===0?{label:'Due today',type:'today'}:n<=7?{label:'Due soon',type:'soon'}:{label:'Upcoming',type:'upcoming'}};
  const billSort=(a,b)=>a.nextDue.localeCompare(b.nextDue);
  function monthAhead(n){const d=parseDate(today());return new Date(d.getFullYear(),d.getMonth()+n,1,12)}
  function simulate(extra, strategy){
    const debts=state.debts.filter(d=>d.balance>0.005).map(d=>({...d,balance:round(d.balance),minPayment:round(d.minPayment)}));
    const initial=round(sum(debts.map(d=>d.balance)));
    const baseBudget=sum(debts.map(d=>d.minPayment));
    const budget=Math.max(0,round(baseBudget+Number(extra||0)));
    const points=[{month:0,balance:initial}],payoff={}, interestById={};let interest=0,totalPaid=0;
    if(initial===0)return {months:0,interest:0,paid:0,remaining:0,points,payoff,valid:true};
    if(budget<=0)return {months:null,interest:null,paid:0,remaining:initial,points,payoff,valid:false};
    for(let month=1;month<=600;month++){
      const monthDate=dateISO(monthAhead(month));let pot=budget;
      const previous=sum(debts.map(d=>d.balance));
      debts.filter(d=>d.balance>0.005).forEach(d=>{
        const rate=d.promoEnd && d.promoEnd>=monthDate ? 0 : Number(d.apr||0);
        const i=round(d.balance*rate/1200);d.balance=round(d.balance+i);interest+=i;interestById[d.id]=(interestById[d.id]||0)+i;
      });
      // Pay each debt's contractual monthly minimum first.
      for(const d of debts){if(d.balance<=0.005)continue;const payment=Math.min(d.balance,d.minPayment,pot);d.balance=round(d.balance-payment);pot=round(pot-payment);totalPaid+=payment;if(d.balance<=0.005&&!payoff[d.id])payoff[d.id]=month}
      // Funnel extra cash and freed-up minimums to one priority debt at a time.
      const effectiveAPR=d=>d.promoEnd && d.promoEnd>=monthDate ? 0 : d.apr;
      const ordered=debts.slice().sort((a,b)=>strategy==='snowball'?(a.balance-b.balance)||(effectiveAPR(b)-effectiveAPR(a)):(effectiveAPR(b)-effectiveAPR(a))||(a.balance-b.balance));
      for(const d of ordered){if(pot<=0.005)break;if(d.balance<=0.005)continue;const pay=Math.min(d.balance,pot);d.balance=round(d.balance-pay);pot=round(pot-pay);totalPaid+=pay;if(d.balance<=0.005&&!payoff[d.id])payoff[d.id]=month}
      const remaining=round(sum(debts.map(d=>d.balance)));points.push({month,balance:remaining});
      if(remaining<=0.005)return {months:month,interest:round(interest),paid:round(totalPaid),remaining:0,points,payoff,valid:true};
      if(month>=36 && remaining>previous && budget<=round(sum(debts.filter(d=>d.balance>0).map(d=>d.balance*d.apr/1200))))break;
    }
    return {months:null,interest:round(interest),paid:round(totalPaid),remaining:round(sum(debts.map(d=>d.balance))),points,payoff,valid:false};
  }
  const projection=()=>simulate(state.settings.extraPayment,state.settings.strategy);
  const payOffLabel=m=>m===null?'Not projected':m===0?'Debt-free now':new Date(monthAhead(m)).toLocaleDateString('en-GB',{month:'short',year:'numeric'});

  const demoBanner=()=>state.mode==='demo'?`<div class="newbie-banner">${icon('info')}<span>You're exploring with <strong>example data</strong>. Nothing shown here is linked to a bank or a real account.</span><button data-action="start-fresh">Start with my own data</button></div>`:'';
  const emptyFooter=()=>`<div class="footer-line">Billora prototype · Your information stays in this browser · Not financial advice</div>`;

  function graph(points,baseline){const w=600,hh=245,left=47,right=14,top=15,bottom=31,wd=w-left-right,ht=hh-top-bottom;const p=[...points]; const monthsMax=Math.max(6,p[p.length-1]?.month||0,baseline[baseline.length-1]?.month||0);const maxBalance=Math.max(1,p[0]?.balance||0,baseline[0]?.balance||0);const X=i=>left+(i/monthsMax)*wd,Y=n=>top+ht-(n/maxBalance)*ht; const line=arr=>arr.map((d,i)=>`${i?'L':'M'}${X(d.month).toFixed(2)},${Y(d.balance).toFixed(2)}`).join(' ');const area=arr=>`${line(arr)} L${X(arr[arr.length-1]?.month||0)},${Y(0)} L${X(0)},${Y(0)} Z`;let grid='';for(let i=0;i<=4;i++){const y=Y(maxBalance*i/4);grid+=`<line x1="${left}" x2="${w-right}" y1="${y}" y2="${y}" stroke="#edf0f5" stroke-dasharray="4 4"/><text x="${left-10}" y="${y+4}" class="chart-label" text-anchor="end">${Math.round(maxBalance*i/4000)}k</text>`}let ticks='';for(let i=0;i<=4;i++){const m=Math.round(monthsMax*i/4);ticks+=`<text x="${X(m)}" y="${hh-8}" class="chart-label" text-anchor="middle">${m} mo</text>`} return `<svg viewBox="0 0 ${w} ${hh}" role="img" aria-label="Projected outstanding debt over time"><defs><linearGradient id="billoraFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7065f7" stop-opacity=".25"/><stop offset="100%" stop-color="#7065f7" stop-opacity=".005"/></linearGradient></defs>${grid}${ticks}${baseline.length>1?`<path d="${line(baseline)}" stroke="#d8d9e5" stroke-width="2.5" stroke-dasharray="6 6" fill="none"/>`:''}<path d="${area(p)}" fill="url(#billoraFade)"/><path d="${line(p)}" stroke="#6157f5" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`}
  function renderPlanner(){const settings=state.settings,base=simulate(0,settings.strategy),result=projection();const extra=settings.extraPayment,saved=(base.valid&&result.valid)?round(base.interest-result.interest):null;const monthsSaved=(base.valid&&result.valid)?base.months-result.months:null;const effectiveAPR=d=>d.promoEnd && d.promoEnd>=today()?0:d.apr;const sorted=state.debts.filter(d=>d.balance>0).sort((a,b)=>settings.strategy==='snowball'?(a.balance-b.balance)||(effectiveAPR(b)-effectiveAPR(a)):(effectiveAPR(b)-effectiveAPR(a))||(a.balance-b.balance));

  function billModal(id){const b=id?getBill(id):null;const fields=input('name','Bill name','text',b?.name||'','required maxlength="100"',true)+input('amount','Amount (£)','number',b?.amount??'','min="0.01" max="100000000" step="0.01" required')+input('nextDue','Next payment date','date',b?.nextDue||today(),'required')+select('frequency','How often?',freqOptions,b?.frequency||'monthly')+select('category','Category',Object.keys(categoryColors).map(v=>[v,v]),b?.category||'Home');modal(b?'Edit bill':'Add a bill','Keep the amount and next payment date up to date.',fields,'bill',id)}
  function debtModal(id){const d=id?getDebt(id):null;const fields=input('name','Account / loan name','text',d?.name||'','required maxlength="100"',true)+input('balance','Current balance (£)','number',d?.balance??'','min="0" max="100000000" step="0.01" required')+input('apr','APR after any offer (%)','number',d?.apr??'','min="0" max="100" step="0.01" required')+input('minPayment','Monthly minimum (£)','number',d?.minPayment??'','min="0" max="100000000" step="0.01" required')+input('originalBalance','Starting balance (£)','number',d?.originalBalance??'','min="0" max="100000000" step="0.01" required',false,'Used for the progress bar; enter at least the current balance.')+input('promoEnd','0% offer end (optional)','date',d?.promoEnd||'','',false,'Interest is assumed to be 0% until this date.');modal(d?'Edit debt':'Add a debt','Track a credit card, loan or other balance.',fields,'debt',id)}
  function incomeModal(id){const i=id?getIncome(id):null;const fields=input('name','Income source','text',i?.name||'','required maxlength="100"',true)+input('amount','Amount per payday (£)','number',i?.amount??'','min="0" max="100000000" step="0.01" required')+select('frequency','Paid how often?',freqOptions,i?.frequency||'monthly');modal(i?'Edit income':'Add income','Include wages, benefits or other regular income.',fields,'income',id)}
  function debtPaymentModal(id){const d=getDebt(id);if(!d)return;modal('Record a repayment',`Current balance: ${amount(d.balance)}. Record the amount that actually reduced the balance.`,input('payment','Amount paid (£)','number',Math.min(d.balance,d.minPayment||d.balance),'min="0.01" max="'+d.balance+'" step="0.01" required',true),'payment',id)}
  function onSaveForm(form){const data=Object.fromEntries(new FormData(form));const kind=form.dataset.kind,id=form.dataset.id;const val=x=>round(Number(data[x]));
    if(kind==='bill'){if(!data.name.trim()||val('amount')<=0||!validDate(data.nextDue))return notify('Enter a valid bill name, amount and date.');const payload={name:data.name.trim().slice(0,100),amount:val('amount'),nextDue:data.nextDue,anchorDay:parseDate(data.nextDue).getDate(),frequency:data.frequency,category:data.category};if(id){Object.assign(getBill(id),payload)}else state.bills.push({id:uid(),...payload,autopay:false,payments:[]})}
    if(kind==='debt'){if(!data.name.trim()||val('balance')<0||val('minPayment')<0||val('apr')<0||val('apr')>100||val('originalBalance')<val('balance'))return notify('Check the balance, APR, minimum payment and starting balance.');const payload={name:data.name.trim().slice(0,100),balance:val('balance'),apr:val('apr'),minPayment:val('minPayment'),originalBalance:val('originalBalance'),promoEnd:data.promoEnd};if(id){Object.assign(getDebt(id),payload)}else state.debts.push({id:uid(),...payload,payments:[]})}
    if(kind==='income'){if(!data.name.trim()||val('amount')<0)return notify('Enter a valid income source and amount.');const payload={name:data.name.trim().slice(0,100),amount:val('amount'),frequency:data.frequency};if(id){Object.assign(getIncome(id),payload)}else state.incomes.push({id:uid(),...payload})}
    if(kind==='payment'){const d=getDebt(id),payment=val('payment');if(!d||payment<=0||payment>d.balance)return notify('Payment must be greater than zero and no more than the balance.');d.balance=round(d.balance-payment);d.payments=(d.payments||[]).concat([{date:today(),amount:payment}]).slice(-30)}
    save();closeModal();render();notify(kind==='payment'?'Debt repayment recorded.':'Saved successfully.');
  }
  function download(name,text,contentType){const blob=new Blob([text],{type:contentType});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
  async function importFile(file){if(!file)return;try{if(file.size>2e6)throw Error('The file is too large.');const data=sanitizeState(JSON.parse(await file.text()));if(!confirm('Importing this backup will replace everything currently in this browser. Continue?'))return;state=data;save();render();notify('Your backup was imported.')}catch(e){notify(e.message||'Could not import that backup.')}finally{const el=$('#backup-input');if(el)el.value=''}}
  document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){e.preventDefault();navigate(nav.dataset.nav);return}const target=e.target.closest('[data-action]');if(!target){if(e.target.id==='modal-backdrop')closeModal();return}const action=target.dataset.action,id=target.dataset.id;
    switch(action){case 'add-bill':billModal();break;case 'edit-bill':billModal(id);break;case 'add-debt':debtModal();break;case 'edit-debt':debtModal(id);break;case 'add-income':incomeModal();break;case 'edit-income':incomeModal(id);break;case 'pay-debt':debtPaymentModal(id);break;case 'close-modal':closeModal();break;
      case 'pay-bill':{const bill=getBill(id);if(!bill)return;if(!confirm(`Record ${amount(bill.amount)} as paid for ${bill.name} and advance the due date?`))return;bill.payments=(bill.payments||[]).concat([{date:today(),amount:bill.amount,due:bill.nextDue}]).slice(-30);bill.nextDue=advanceDue(bill);save();render();notify(`${bill.name} marked paid.`);break}
      case 'delete-bill':{const b=getBill(id);if(b&&confirm(`Delete ${b.name} from your tracked bills?`)){state.bills=state.bills.filter(x=>x.id!==id);save();render();notify('Bill deleted.')}break}
      case 'delete-debt':{const d=getDebt(id);if(d&&confirm(`Delete ${d.name} and its tracked balance?`)){state.debts=state.debts.filter(x=>x.id!==id);save();render();notify('Debt removed.')}break}
      case 'delete-income':{const i=getIncome(id);if(i&&confirm(`Delete ${i.name} from your income sources?`)){state.incomes=state.incomes.filter(x=>x.id!==id);save();render();notify('Income source removed.')}break}
      case 'strategy':{state.settings.strategy=target.dataset.value==='snowball'?'snowball':'avalanche';save();render();break}
      case 'start-fresh':{if(!confirm('Start fresh? This will clear all the sample or saved items on this device. Export a backup first if you want to keep them.'))return;state={version:1,mode:'personal',incomes:[],bills:[],debts:[],settings:{strategy:'avalanche',extraPayment:100}};save();navigate('overview');notify('Your workspace is ready.');break}
      case 'restore-demo':{if(!confirm('Restore example data? This will replace your current entries.'))return;state=demo();save();navigate('overview');notify('Example data restored.');break}
      case 'export':{const backup=JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2);download(`billora-backup-${today()}.json`,backup,'application/json');notify('Your backup has been downloaded.');break}
      case 'import':$('#backup-input')?.click();break;
    }
  });
  document.addEventListener('submit',e=>{if(e.target?.id==='modal-form'){e.preventDefault();onSaveForm(e.target)}});
  document.addEventListener('input',e=>{if(e.target?.id==='bill-search'){const start=e.target.selectionStart;query=e.target.value;render();const field=$('#bill-search');field.focus();try{field.setSelectionRange(start,start)}catch(_){}return}if(e.target?.id==='extra-range'){$('#extra-display').textContent=shortAmount(e.target.value)}});
  document.addEventListener('change',e=>{if(e.target?.id==='extra-range'){state.settings.extraPayment=Number(e.target.value);save();render()}if(e.target?.id==='backup-input')importFile(e.target.files[0])});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
  window.addEventListener('hashchange',()=>{const next=location.hash.slice(1);if(['overview','bills','debts','planner','settings'].includes(next)){page=next;query='';render()}});
  iconify();render();
})();

</script>
</body>
</html>
